name: process_petsys
channels:
  - conda-forge
  - defaults  
dependencies:
  - python=3.10.14
  - pip:
      - numpy==1.24.3
      - docopt==0.6.2
      - pyyaml==6.0.1
      - matplotlib==3.8.2
      - scipy==1.12.0
      - sphinx==7.2.6
      - pandas==2.2.1
      - keras==2.13.1
      - tensorflow==2.13.0
      - openpyxl==3.1.5
      - tqdm==4.66.4
      - colorama
      - natsort
      - pyqtgraph==0.13.3
      - PyQt5==5.15.10
      - PyOpenGL==3.1.10
      - customtkinter==5.2.2
      - pypdf==6.0.0  # PDF content verification for LDATInspector reports
      - numba==0.63.1  # LDATInspector fast LDAT reader (spec 002)
      - reportlab==4.4.9  # Cornell QC missing-channel PDF (spec 003)
      - pytest==8.3.5  # tracked tests/ suite (spec 006)
      - exceptiongroup==1.2.2  # pytest dependency; newer needs typing-extensions>=4.6, tensorflow 2.13 needs <4.6
      - pytest-xdist==3.8.0  # parallel default test run (spec 007)
      - execnet==2.1.2  # pytest-xdist dependency
