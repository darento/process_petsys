# pytest configuration only (spec 006); packaging stays in setup.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Default run excludes real_data; a command-line -m replaces this one.
# No cacheprovider: pytest writes nothing into the repo tree.
addopts = ["--strict-markers", "-m", "not real_data", "-p", "no:cacheprovider", "-p", "pytester"]
markers = [
    "real_data: needs acquisitions/calibrations under PETSYS_DATA_DIR; excluded by default",
    "gui: opens hidden Tk windows; skipped when no display is available",
    "linux: runs only on Linux (Cornell PC); skipped elsewhere",
    "slow: takes more than a few seconds; runs by default",
    "fr(*ids): requirement ids this test checks, e.g. 003-FR-21 or bug-<short-name>; select with --fr <id>",
]
